# CodeQualityBenchmarker Spring Boot Configuration
server.port=8080

# Application Details
spring.application.name=CodeQualityBenchmarker

# Default Resilience Profile: H2 in PostgreSQL compatibility mode
# To run on native PostgreSQL: run with --spring.profiles.active=postgres or set SPRING_PROFILES_ACTIVE=postgres
spring.datasource.url=jdbc:h2:mem:codequality;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Enable H2 Console for rapid inspection
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AI Service Configuration
# Configure your GEMINI_API_KEY or OPENAI_API_KEY environment variables to enable generative AI refactoring
codequality.ai.engine=DeterministicAST
